name: Go CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Vet
        run: |
          go vet ./...

      - name: Run Tests
        run: |
          go test ./... -v

      - name: Build Project
        run: |
          go build ./cmd
